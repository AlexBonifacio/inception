# services networks volumes ports build image environment
# spaces no tab

services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx
    env_file:
      - .env
    networks:
      - inception
    volumes:
      - wordpress_vol:/var/www/html
    ports:
      - "1025:1025"
    depends_on: 
      - wordpress
    restart: on-failure


  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    container_name: wordpress
    env_file:
      - .env
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_started
    volumes:
      - wordpress_vol:/var/www/html
    restart: on-failure
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password

  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    volumes:
      - mariadb_vol:/var/lib/mysql
    env_file:
      - .env
    networks:
      - inception
    restart: on-failure
    secrets:
      - db_root_password
      - db_password


volumes:
  wordpress_vol:
    driver: local
    driver_opts:
      type: none
      device: /home/abonifac/data/wordpress
      o: bind
  mariadb_vol:
    driver: local
    driver_opts:
      type: none
      device: /home/abonifac/data/mariadb
      o: bind

networks:
  inception:

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
